name: CI

on:
  push:
    branches: [main, phase-1, phase-2, feature/macos-port]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxtst-dev libxkbcommon-dev \
            libasound-dev portaudio19-dev libportaudio2 libpulse-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxtst-dev libxkbcommon-dev \
            libasound-dev portaudio19-dev libportaudio2 libpulse-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev

      - name: Stage frontend for go:embed
        run: make stage-frontend

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  darwin-build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile abstraction packages (CGO=0)
        run: make build-darwin

      - name: Build macOS spike binary (CGO=1)
        run: |
          go build -o tomoe-mac-spike \
            -ldflags="-X main.Version=$(git rev-parse --short HEAD)" \
            ./cmd/macos-spike
          ls -la tomoe-mac-spike
          file tomoe-mac-spike

      - name: Smoke-run spike on the runner (60s baseline)
        run: |
          ./tomoe-mac-spike --duration 60s | tee runner-spike-stdout.log || true
          echo "--- log files ---"
          ls -la tomoe-spike-*.log 2>/dev/null || echo "(no log file produced — likely macOS <14.2 on runner)"
        timeout-minutes: 3
        continue-on-error: true

      - name: Upload spike artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomoe-mac-spike-arm64
          path: tomoe-mac-spike
          retention-days: 30

      - name: Upload runner smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tomoe-mac-spike-runner-logs
          path: |
            tomoe-spike-*.log
            runner-spike-stdout.log
          retention-days: 30
          if-no-files-found: warn
